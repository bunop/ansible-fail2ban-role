# Fail2Ban filter for vsftpd connection floods
#
# Matches every new FTP session (not just failed logins), so scanners and
# clients stuck in a reconnect loop trip the jail. Needs "dual_log_enable=YES"
# and fail2ban watching /var/log/vsftpd.log, like vsftpd-attempt.

[Definition]

# Mon Oct 12 21:19:48 2026 [pid 212806] CONNECT: Client "4.232.189.229"
failregex = \[pid\s+\d+\]\s+CONNECT:\s+Client\s+"<HOST>"

ignoreregex =
