# Fail2Ban filter for account registration/activation/password reset abuse
#
# Bots use these forms to make the app mail third-party addresses. Matches
# POSTs only, on the usual django-registration paths. Needs the "combined"
# access log format, with the client address first.

[Definition]

# 185.220.101.4 - - [14/Oct/2026:07:17:01 +0000] "POST /accounts/register/ HTTP/1.1" 302 0 "-" "Mozilla/5.0"
failregex = ^<HOST> .* "POST /+accounts/(register|activate/resend|password_reset)/

ignoreregex =
