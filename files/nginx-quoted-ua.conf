# Fail2Ban filter for bots sending a User-Agent wrapped in literal double quotes
#
# nginx logs the quotes as \x22, e.g. "\x22Mozilla/5.0 (...) Safari/537.36\x22".
# No legitimate browser does this. Needs the "combined" access log format, with
# the client address first and the User-Agent as the last field.

[Definition]

failregex = ^<HOST> .* "\\x22[^"]*\\x22"\s*$

ignoreregex =
