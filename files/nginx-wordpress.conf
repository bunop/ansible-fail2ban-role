# Fail2Ban filter for WordPress brute force
#
# WordPress answers a failed login with 200 (and xmlrpc.php with a 200 fault
# body), so nginx-4xx never fires: count the POSTs themselves. Needs the
# "combined" access log format, with the client address first.

[Definition]

# 158.173.89.242 - - [14/Oct/2026:07:17:01 +0000] "POST /wp-login.php HTTP/1.1" 200 5000 "-" "Mozilla/5.0"
failregex = ^<HOST> .* "POST /+(wp-login\.php|xmlrpc\.php)

ignoreregex =
