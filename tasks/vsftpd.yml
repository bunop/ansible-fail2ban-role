
- name: copy vsftpd-attempt.conf and vsftpd-flood.conf
  copy:
    src: "{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
  loop:
    - vsftpd-attempt.conf
    - vsftpd-flood.conf
  notify: restart fail2ban
  tags: [configure, vsftp_role]

# ensure file exists
# create a new empty file only when the file does not yet exist
# https://stackoverflow.com/a/34929776
- name: ensure logfile exists (before using vsftpd)
  copy:
    content: ""
    dest: /var/log/vsftpd.log
    force: no
    group: sys
    owner: root
    mode: 0644
  tags: [configure, vsftp_role]

- stat:
    path: /etc/fail2ban/jail.local
  register: jail_local_inplace
  tags:
    - configure
    - vsftp_role

- name: add VSFTPD configuration for fail2ban
  blockinfile:
    path: /etc/fail2ban/jail.local
    marker: "# {mark} VSFTPD configuration"
    insertafter: "# VSFTPD custom configuration"
    content: |
        [vsftpd]
        # or overwrite it in jails.local to be
        # logpath = %(syslog_authpriv)s
        # if you want to rely on PAM failed login attempts
        # vsftpd's failregex should match both of those formats
        enabled  = true
        port     = ftp,ftp-data,ftps,ftps-data
        logpath  = %(vsftpd_log)s

        # Protect against FTP attempts
        [vsftpd-attempt]
        enabled  = true
        port     = ftp,ftp-data,ftps,ftps-data
        filter = vsftpd-attempt
        logpath  = %(vsftpd_log)s
        maxretry = 10
        findtime = 150
        bantime = 2h

        # Protect against connection floods (scanners, clients stuck in a
        # reconnect loop): same threshold as Wazuh rule 11452
        [vsftpd-flood]
        enabled  = true
        port     = ftp,ftp-data,ftps,ftps-data
        filter = vsftpd-flood
        logpath  = %(vsftpd_log)s
        maxretry = 12
        findtime = 60
        bantime = 1h
  when: jail_local_inplace.stat.exists
  notify: reload fail2ban
  tags: [configure, vsftp_role]
